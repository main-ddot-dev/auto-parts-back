name: Deploy IA Backend to AWS ECR & Lambda

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'remove_background_lambda/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          if [[ $GITHUB_REF == 'refs/heads/main' ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "LAMBDA_NAME=remove_background_lambda_prod" >> $GITHUB_ENV
            echo "DEST_BUCKET=piezas-sin-fondo-prod" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
            echo "LAMBDA_NAME=remove_background_lambda_dev" >> $GITHUB_ENV
            echo "DEST_BUCKET=piezas-sin-fondo-dev" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: auto-parts-back
          IMAGE_TAG: ${{ env.ENV }}-${{ github.sha }}
        run: |
          cd remove_background_lambda
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          
          # Actualizar la Lambda correspondiente
          # aws lambda update-function-code \
          #   --function-name ${{ env.LAMBDA_NAME }} \
          #   --image-uri $REGISTRY/$REPOSITORY:$IMAGE_TAG
            
          # Actualizar las variables de entorno de la Lambda
          # aws lambda update-function-configuration \
          #   --function-name ${{ env.LAMBDA_NAME }} \
          #   --environment "Variables={DESTINATION_BUCKET=${{ env.DEST_BUCKET }}}"